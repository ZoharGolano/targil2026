# Targil2026 - Argo CD configuration
# Helm chart: argo/argo-cd
# Chart version: 10.18.2

global:
  domain: argocd.test

configs:
  params:
    server.insecure: true

controller:
  replicas: 1

server:
  replicas: 1
  service:
    type: ClusterIP

  ingress:
    enabled: true
    controller: generic
    ingressClassName: traefik
    hostname: argocd.test
    path: /
    pathType: Prefix
    tls: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
repoServer:
  replicas: 1

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false

redis-ha:
  enabled: false
